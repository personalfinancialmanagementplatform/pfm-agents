<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChainPortfolio — 區塊鏈證明驗證</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<style>
  :root {
    --navy: #07111f;
    --navy-mid: #0d1e33;
    --navy-card: #111f35;
    --navy-border: #1e3352;
    --gold: #c9a84c;
    --gold-light: #e0c068;
    --gold-dim: rgba(201,168,76,0.15);
    --gold-border: rgba(201,168,76,0.35);
    --text: #e8dfc8;
    --text-dim: #8fa3b8;
    --text-muted: #4a6278;
    --success-bg: rgba(22,163,74,0.12);
    --success-border: rgba(34,197,94,0.35);
    --success-text: #4ade80;
    --fail-bg: rgba(220,38,38,0.12);
    --fail-border: rgba(239,68,68,0.35);
    --fail-text: #f87171;
    --warn-bg: rgba(217,119,6,0.12);
    --warn-border: rgba(245,158,11,0.35);
    --warn-text: #fbbf24;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Noto Serif TC', 'IM Fell English', serif;
    --display: 'IM Fell English', 'Noto Serif TC', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: var(--serif);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .page-wrap {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  /* ─── Header ─── */
  .header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: var(--gold-dim);
    margin-bottom: 1.25rem;
    position: relative;
  }

  .seal::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 1px dashed var(--gold-border);
  }

  .seal svg {
    width: 36px;
    height: 36px;
    color: var(--gold);
  }

  .header-title {
    font-family: var(--display);
    font-size: 1.9rem;
    font-weight: 400;
    color: var(--gold-light);
    letter-spacing: 0.02em;
    line-height: 1.2;
    margin-bottom: 0.4rem;
  }

  .header-title-zh {
    font-family: var(--serif);
    font-size: 1rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    font-weight: 400;
  }

  .header-rule {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
    margin: 1.25rem auto 0.75rem;
  }

  .header-desc {
    font-size: 0.875rem;
    color: var(--text-muted);
    line-height: 1.6;
    font-style: italic;
  }

  /* ─── Network Badge ─── */
  .network-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 2rem;
  }

  .network-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success-text);
    box-shadow: 0 0 6px var(--success-text);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ─── Card ─── */
  .card {
    background: var(--navy-card);
    border: 1px solid var(--navy-border);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 1.5rem;
  }

  .card-title {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--navy-border);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* ─── Form ─── */
  .field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .field-group.full { grid-template-columns: 1fr; }

  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
  }

  .field input {
    width: 100%;
    background: var(--navy-mid);
    border: 1px solid var(--navy-border);
    border-radius: 6px;
    padding: 0.55rem 0.75rem;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.85rem;
    transition: border-color 0.2s;
    outline: none;
  }

  .field input:focus {
    border-color: var(--gold-border);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
  }

  .field input::placeholder {
    color: var(--text-muted);
    font-style: italic;
  }

  /* ─── Button ─── */
  .btn-verify {
    width: 100%;
    padding: 0.85rem;
    background: var(--gold-dim);
    border: 1px solid var(--gold-border);
    border-radius: 8px;
    color: var(--gold-light);
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .btn-verify:hover {
    background: rgba(201,168,76,0.25);
    border-color: var(--gold);
  }

  .btn-verify:active { transform: scale(0.99); }

  .btn-verify:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* ─── Loading ─── */
  .loading-wrap {
    text-align: center;
    padding: 2rem;
    display: none;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid var(--navy-border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  /* ─── Result ─── */
  #result-section { display: none; }

  .verdict-box {
    border-radius: 10px;
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.5rem;
    border: 1px solid;
    position: relative;
    overflow: hidden;
  }

  .verdict-box.success {
    background: var(--success-bg);
    border-color: var(--success-border);
  }

  .verdict-box.fail {
    background: var(--fail-bg);
    border-color: var(--fail-border);
  }

  .verdict-box.warn {
    background: var(--warn-bg);
    border-color: var(--warn-border);
  }

  .verdict-icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    display: block;
  }

  .verdict-title {
    font-family: var(--display);
    font-size: 1.4rem;
    font-weight: 400;
    margin-bottom: 0.35rem;
  }

  .verdict-box.success .verdict-title { color: var(--success-text); }
  .verdict-box.fail .verdict-title { color: var(--fail-text); }
  .verdict-box.warn .verdict-title { color: var(--warn-text); }

  .verdict-sub {
    font-size: 0.875rem;
    line-height: 1.6;
  }

  .verdict-box.success .verdict-sub { color: rgba(134,239,172,0.8); }
  .verdict-box.fail .verdict-sub { color: rgba(252,165,165,0.8); }
  .verdict-box.warn .verdict-sub { color: rgba(253,230,138,0.8); }

  /* ─── Detail Table ─── */
  .detail-block { margin-bottom: 1.5rem; }

  .detail-row {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 0.75rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid rgba(30,51,82,0.6);
    align-items: start;
  }

  .detail-row:last-child { border-bottom: none; }

  .detail-key {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    padding-top: 2px;
    text-transform: uppercase;
  }

  .detail-val {
    font-size: 0.9rem;
    color: var(--text);
    word-break: break-all;
    line-height: 1.5;
  }

  .detail-val.mono {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    font-weight: 500;
  }

  .badge.verified   { background: rgba(34,197,94,0.15);  color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
  .badge.pending    { background: rgba(234,179,8,0.15);   color: #facc15; border: 1px solid rgba(234,179,8,0.3); }
  .badge.rejected   { background: rgba(239,68,68,0.15);   color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
  .badge.revoked    { background: rgba(156,163,175,0.15); color: #9ca3af; border: 1px solid rgba(156,163,175,0.3); }
  .badge.unverified { background: rgba(156,163,175,0.1);  color: #6b7280; border: 1px solid rgba(156,163,175,0.2); }
  .badge.trusted    { background: rgba(34,197,94,0.12);   color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
  .badge.untrusted  { background: rgba(239,68,68,0.12);   color: #f87171; border: 1px solid rgba(239,68,68,0.25); }

  /* ─── Hash Compare ─── */
  .hash-compare {
    background: var(--navy-mid);
    border: 1px solid var(--navy-border);
    border-radius: 8px;
    padding: 1rem;
    margin-top: 0.5rem;
  }

  .hash-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .hash-row:last-child { margin-bottom: 0; }

  .hash-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .hash-val {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--text-dim);
    word-break: break-all;
    line-height: 1.4;
  }

  .hash-match { color: var(--success-text) !important; }
  .hash-mismatch { color: var(--fail-text) !important; }

  .hash-divider {
    height: 1px;
    background: var(--navy-border);
    margin: 0.5rem 0;
  }

  .hash-result-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    margin-top: 0.5rem;
  }

  /* ─── Checklist ─── */
  .checklist {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--mono);
    font-size: 0.78rem;
  }

  .check-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    flex-shrink: 0;
  }

  .check-icon.ok   { background: rgba(34,197,94,0.2);  color: var(--success-text); }
  .check-icon.err  { background: rgba(239,68,68,0.2);  color: var(--fail-text); }
  .check-icon.warn { background: rgba(245,158,11,0.2); color: var(--warn-text); }

  .check-text.ok   { color: rgba(134,239,172,0.9); }
  .check-text.err  { color: rgba(252,165,165,0.9); }
  .check-text.warn { color: rgba(253,230,138,0.9); }

  /* ─── Footer ─── */
  .footer {
    text-align: center;
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--navy-border);
  }

  .footer-text {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    line-height: 1.8;
  }

  .footer-brand {
    color: var(--gold);
    letter-spacing: 0.1em;
  }

  /* ─── Error Banner ─── */
  .error-banner {
    background: var(--fail-bg);
    border: 1px solid var(--fail-border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--fail-text);
    margin-top: 1rem;
    display: none;
  }

  /* ─── Divider ─── */
  .or-divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 1.25rem 0;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }

  .or-divider::before,
  .or-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--navy-border);
  }

  .reset-btn {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.5rem 1.25rem;
    border: 1px solid var(--navy-border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
  }

  .reset-btn:hover {
    border-color: var(--gold-border);
    color: var(--gold);
  }

  @media (max-width: 560px) {
    .field-group { grid-template-columns: 1fr; }
    .detail-row { grid-template-columns: 1fr; gap: 0.25rem; }
    .detail-key { padding-top: 0; }
    .header-title { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="page-wrap">

  <!-- Header -->
  <header class="header">
    <div class="seal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
      </svg>
    </div>
    <h1 class="header-title">Blockchain Credential Verifier</h1>
    <p class="header-title-zh">區塊鏈學生經歷驗證系統</p>
    <div class="header-rule"></div>
    <p class="header-desc">密碼學驗證 · 免登入 · 直接讀取鏈上原始資料</p>
  </header>

  <!-- Network Status -->
  <div class="network-bar">
    <div class="network-dot"></div>
    <span id="network-label">連接中...</span>
  </div>

  <!-- Input Card -->
  <div class="card" id="input-card">
    <div class="card-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      輸入驗證資料
    </div>

    <div class="field-group full">
      <div class="field">
        <label>TOKEN ID（鏈上憑證編號）</label>
        <input type="number" id="tokenId" placeholder="例：0" min="0" />
      </div>
    </div>

    <div class="or-divider">以下資料用於重新計算 Hash 以比對鏈上記錄</div>

    <div class="field-group">
      <div class="field">
        <label>學生姓名</label>
        <input type="text" id="studentName" placeholder="例：張小明" />
      </div>
      <div class="field">
        <label>學生錢包地址</label>
        <input type="text" id="studentWallet" placeholder="0x..." />
      </div>
    </div>

    <div class="field-group">
      <div class="field">
        <label>活動名稱</label>
        <input type="text" id="eventName" placeholder="例：AI 黑客松" />
      </div>
      <div class="field">
        <label>獎項 / 職稱</label>
        <input type="text" id="awardTitle" placeholder="例：第一名" />
      </div>
    </div>

    <div class="field-group full">
      <div class="field">
        <label>發證日期（格式：YYYY-MM-DD）</label>
        <input type="text" id="issueDate" placeholder="例：2026-05-27" />
      </div>
    </div>

    <div class="error-banner" id="input-error"></div>

    <button class="btn-verify" id="verify-btn" onclick="startVerify()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
      開始密碼學驗證
    </button>
  </div>

  <!-- Loading -->
  <div class="loading-wrap" id="loading">
    <div class="spinner"></div>
    <p class="loading-text" id="loading-text">正在讀取鏈上資料...</p>
  </div>

  <!-- Result -->
  <div id="result-section">

    <!-- Verdict -->
    <div class="verdict-box" id="verdict-box">
      <span class="verdict-icon" id="verdict-icon"></span>
      <div class="verdict-title" id="verdict-title"></div>
      <div class="verdict-sub" id="verdict-sub"></div>

      <div class="checklist" id="checklist" style="margin-top:1rem;"></div>
    </div>

    <!-- Chain Data -->
    <div class="card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13.828 10.172a4 4 0 0 0-5.656 0l-4 4a4 4 0 1 0 5.656 5.656l1.102-1.101m-.758-4.899a4 4 0 0 0 5.656 0l4-4a4 4 0 0 0-5.656-5.656l-1.1 1.1"/></svg>
        鏈上資料
      </div>
      <div class="detail-block" id="chain-data"></div>
    </div>

    <!-- Hash Compare -->
    <div class="card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4 4 4m6 0v12m0 0 4-4m-4 4-4-4"/></svg>
        Hash 比對
      </div>
      <div class="detail-block">
        <div class="detail-row">
          <span class="detail-key">原始文字串</span>
          <span class="detail-val mono" id="raw-text-display"></span>
        </div>
      </div>
      <div class="hash-compare" id="hash-compare"></div>
    </div>

    <div style="text-align:center;">
      <button class="reset-btn" onclick="resetForm()">← 返回重新驗證</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-text">
      <span class="footer-brand">ChainPortfolio</span><br/>
      此頁面直接讀取鏈上資料，不依賴任何中介伺服器<br/>
      所有驗證計算在您的瀏覽器本地完成
    </div>
  </footer>

</div>

<script>
// ─── Config ─────────────────────────────────────────────────────────────
// 請根據當前環境修改以下設定
const CONFIG = {
  // Anvil 本地測試
  // rpcUrl: "http://127.0.0.1:8545",
  // contractAddress: "YOUR_ANVIL_CONTRACT_ADDRESS",

  // Sepolia 測試網（Demo 推薦）
  rpcUrl: "https://ethereum-sepolia-rpc.publicnode.com",
  contractAddress: "YOUR_SEPOLIA_CONTRACT_ADDRESS",

  networkName: "Sepolia Testnet",
};

// ─── ABI（只需 D 組用到的函式）───────────────────────────────────────────
const ABI = [
  {
    name: "getExperience",
    type: "function",
    stateMutability: "view",
    inputs: [{ name: "tokenId", type: "uint256" }],
    outputs: [
      { name: "certHash",       type: "bytes32" },
      { name: "student",        type: "address" },
      { name: "issuer",         type: "address" },
      { name: "category",       type: "string" },
      { name: "experienceType", type: "string" },
      { name: "status",         type: "uint8" },
      { name: "submittedAt",    type: "uint256" },
      { name: "verifiedAt",     type: "uint256" },
    ],
  },
  {
    name: "approvedIssuers",
    type: "function",
    stateMutability: "view",
    inputs: [{ name: "issuer", type: "address" }],
    outputs: [{ name: "", type: "bool" }],
  },
];

const STATUS_MAP = ["Unverified", "Pending", "Verified", "Rejected", "Revoked"];
const STATUS_BADGE = ["unverified", "pending", "verified", "rejected", "revoked"];

// ─── Init ─────────────────────────────────────────────────────────────
let provider, contract;

async function init() {
  try {
    provider = new ethers.JsonRpcProvider(CONFIG.rpcUrl);
    contract = new ethers.Contract(CONFIG.contractAddress, ABI, provider);
    await provider.getBlockNumber(); // test connection
    document.getElementById("network-label").textContent =
      CONFIG.networkName + " · " + CONFIG.contractAddress.slice(0, 8) + "..." + CONFIG.contractAddress.slice(-6);
  } catch (e) {
    document.getElementById("network-label").textContent = "⚠ 無法連線 — 請檢查 Config";
    document.querySelector(".network-dot").style.background = "#f87171";
    document.querySelector(".network-dot").style.boxShadow = "0 0 6px #f87171";
  }
}

// ─── URL Param Auto-fill ──────────────────────────────────────────────
function loadFromUrl() {
  const p = new URLSearchParams(window.location.search);
  if (p.has("tokenId"))     document.getElementById("tokenId").value     = p.get("tokenId");
  if (p.has("name"))        document.getElementById("studentName").value  = p.get("name");
  if (p.has("wallet"))      document.getElementById("studentWallet").value = p.get("wallet");
  if (p.has("event"))       document.getElementById("eventName").value    = p.get("event");
  if (p.has("award"))       document.getElementById("awardTitle").value   = p.get("award");
  if (p.has("date"))        document.getElementById("issueDate").value    = p.get("date");

  // 如果 URL 帶齊了所有參數，自動觸發驗證
  const required = ["tokenId","name","wallet","event","award","date"];
  if (required.every(k => p.has(k) && p.get(k))) {
    setTimeout(startVerify, 600);
  }
}

// ─── Verify ───────────────────────────────────────────────────────────
async function startVerify() {
  const tokenId     = document.getElementById("tokenId").value.trim();
  const studentName = document.getElementById("studentName").value.trim();
  const studentWallet = document.getElementById("studentWallet").value.trim();
  const eventName   = document.getElementById("eventName").value.trim();
  const awardTitle  = document.getElementById("awardTitle").value.trim();
  const issueDate   = document.getElementById("issueDate").value.trim();

  const errEl = document.getElementById("input-error");
  errEl.style.display = "none";

  if (!tokenId || tokenId === "") {
    showInputError("請輸入 Token ID");
    return;
  }
  if (!studentName || !studentWallet || !eventName || !awardTitle || !issueDate) {
    showInputError("請填寫所有欄位以重新計算 Hash");
    return;
  }
  if (!studentWallet.startsWith("0x") || studentWallet.length !== 42) {
    showInputError("錢包地址格式錯誤，請輸入完整的 0x 開頭地址（42字元）");
    return;
  }

  // 切換到 loading
  document.getElementById("input-card").style.display = "none";
  document.getElementById("result-section").style.display = "none";
  const loading = document.getElementById("loading");
  loading.style.display = "block";

  try {
    setLoading("正在讀取鏈上資料...");
    const exp = await contract.getExperience(BigInt(tokenId));

    setLoading("正在計算密碼學 Hash...");
    const rawText = `${studentName}|${studentWallet}|${eventName}|${awardTitle}|${issueDate}`;
    const localHash = ethers.keccak256(ethers.toUtf8Bytes(rawText));
    const chainHash = exp.certHash;

    setLoading("正在驗證發證單位身份...");
    const issuerTrusted = await contract.approvedIssuers(exp.issuer);

    const hashMatched = localHash.toLowerCase() === chainHash.toLowerCase();
    const isVerified = Number(exp.status) === 2;

    renderResult({
      exp, rawText, localHash, chainHash,
      hashMatched, isVerified, issuerTrusted,
      tokenId, studentName, eventName, awardTitle, issueDate
    });

  } catch (err) {
    loading.style.display = "none";
    document.getElementById("input-card").style.display = "block";
    let msg = err.message || String(err);
    if (msg.includes("nonexistent token") || msg.includes("invalid token")) {
      msg = `Token ID ${tokenId} 不存在，請確認編號是否正確`;
    } else if (msg.includes("network") || msg.includes("fetch")) {
      msg = "無法連線至區塊鏈節點，請確認網路設定";
    }
    showInputError("驗證失敗：" + msg);
  }
}

function setLoading(text) {
  document.getElementById("loading-text").textContent = text;
}

function showInputError(msg) {
  const el = document.getElementById("input-error");
  el.textContent = msg;
  el.style.display = "block";
}

// ─── Render Result ────────────────────────────────────────────────────
function renderResult(d) {
  document.getElementById("loading").style.display = "none";
  document.getElementById("result-section").style.display = "block";

  // Verdict
  const verdictBox = document.getElementById("verdict-box");
  const overallPass = d.hashMatched && d.isVerified && d.issuerTrusted;

  if (overallPass) {
    verdictBox.className = "verdict-box success";
    document.getElementById("verdict-icon").textContent = "✓";
    document.getElementById("verdict-title").textContent = "驗證成功";
    document.getElementById("verdict-sub").textContent =
      `此證明由【${d.exp.issuer.slice(0,8)}...${d.exp.issuer.slice(-6)}】可信發證單位發出，內容真實未經竄改`;
  } else if (!d.hashMatched) {
    verdictBox.className = "verdict-box fail";
    document.getElementById("verdict-icon").textContent = "✗";
    document.getElementById("verdict-title").textContent = "驗證失敗 — 資料已遭竄改";
    document.getElementById("verdict-sub").textContent = "您提供的資料重新計算所得 Hash 與鏈上記錄不符，文件內容可能已被修改";
  } else if (!d.isVerified) {
    verdictBox.className = "verdict-box warn";
    document.getElementById("verdict-icon").textContent = "⚠";
    document.getElementById("verdict-title").textContent = "此經歷尚未完成驗證";
    document.getElementById("verdict-sub").textContent =
      `目前狀態：${STATUS_MAP[Number(d.exp.status)]}。Hash 比對一致，但發證單位尚未核准或已撤銷`;
  } else {
    verdictBox.className = "verdict-box fail";
    document.getElementById("verdict-icon").textContent = "✗";
    document.getElementById("verdict-title").textContent = "發證單位不在可信名單";
    document.getElementById("verdict-sub").textContent = "Hash 比對一致，但發證地址目前未被列為可信發證單位";
  }

  // Checklist
  const cl = document.getElementById("checklist");
  cl.innerHTML = [
    checkItem(d.hashMatched, "Hash 比對", d.hashMatched ? "本地計算值與鏈上 certHash 完全一致" : "Hash 不符，資料已被竄改"),
    checkItem(d.isVerified, "驗證狀態", d.isVerified ? "狀態為 Verified（已驗證）" : `狀態為 ${STATUS_MAP[Number(d.exp.status)]}，非 Verified`),
    checkItem(d.issuerTrusted, "發證單位", d.issuerTrusted ? "發證地址位於白名單" : "發證地址不在白名單"),
  ].join("");

  // Chain data
  const ts = (u) => u > 0 ? new Date(Number(u) * 1000).toLocaleString("zh-TW") : "—";
  document.getElementById("chain-data").innerHTML = `
    <div class="detail-row">
      <span class="detail-key">Token ID</span>
      <span class="detail-val mono">${d.tokenId}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">學生地址</span>
      <span class="detail-val mono">${d.exp.student}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">發證地址</span>
      <span class="detail-val mono">${d.exp.issuer}
        &nbsp;<span class="badge ${d.issuerTrusted ? 'trusted' : 'untrusted'}">${d.issuerTrusted ? '✓ 可信' : '✗ 不可信'}</span>
      </span>
    </div>
    <div class="detail-row">
      <span class="detail-key">類別</span>
      <span class="detail-val">${d.exp.category || "—"}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">經歷類型</span>
      <span class="detail-val">${d.exp.experienceType || "—"}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">狀態</span>
      <span class="detail-val">
        <span class="badge ${STATUS_BADGE[Number(d.exp.status)]}">${STATUS_MAP[Number(d.exp.status)]}</span>
      </span>
    </div>
    <div class="detail-row">
      <span class="detail-key">提交時間</span>
      <span class="detail-val">${ts(d.exp.submittedAt)}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">驗證時間</span>
      <span class="detail-val">${ts(d.exp.verifiedAt)}</span>
    </div>
  `;

  // Raw text
  document.getElementById("raw-text-display").textContent = d.rawText;

  // Hash compare
  const match = d.hashMatched;
  document.getElementById("hash-compare").innerHTML = `
    <div class="hash-row">
      <span class="hash-label">本地計算</span>
      <span class="hash-val ${match ? 'hash-match' : 'hash-mismatch'}">${d.localHash}</span>
    </div>
    <div class="hash-divider"></div>
    <div class="hash-row">
      <span class="hash-label">鏈上記錄</span>
      <span class="hash-val ${match ? 'hash-match' : ''}">${d.chainHash}</span>
    </div>
    <div class="hash-result-row">
      <span style="color:${match ? 'var(--success-text)' : 'var(--fail-text)'}">
        ${match ? '✓ 兩者完全一致 — 資料未被竄改' : '✗ Hash 不符 — 資料已被竄改'}
      </span>
    </div>
  `;
}

function checkItem(ok, label, detail) {
  const cls = ok ? "ok" : "err";
  const icon = ok ? "✓" : "✗";
  return `
    <div class="check-item">
      <div class="check-icon ${cls}">${icon}</div>
      <span class="check-text ${cls}"><strong>${label}：</strong>${detail}</span>
    </div>`;
}

// ─── Reset ────────────────────────────────────────────────────────────
function resetForm() {
  document.getElementById("result-section").style.display = "none";
  document.getElementById("input-card").style.display = "block";
  document.getElementById("input-error").style.display = "none";
}

// ─── Boot ─────────────────────────────────────────────────────────────
init();
loadFromUrl();
</script>
</body>
</html>
