services:
  mongodb:
    image: mongo:7
    container_name: pfm-mongodb
    environment:
      MONGO_INITDB_DATABASE: pfm_agents
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pfm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/pfm_agents --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pfm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pfm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  redis_data:

networks:
  pfm-network:
    driver: bridge
